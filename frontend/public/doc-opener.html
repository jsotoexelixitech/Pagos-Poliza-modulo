<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abriendo documentos…</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #334155;
    }
    .box { text-align: center; padding: 2rem; max-width: 24rem; }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; color: #0f172a; }
    p { font-size: 0.875rem; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Abriendo documentos de tu póliza</h1>
    <p id="status">Esperando confirmación de emisión…</p>
  </div>
  <script>
    var docsOpened = false;

    function openUrl(url) {
      var form = document.createElement('form');
      form.method = 'GET';
      form.action = url;
      form.target = '_blank';
      form.style.display = 'none';
      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    window.addEventListener('message', function (event) {
      if (event.origin !== window.location.origin) return;
      var data = event.data;
      if (!data || data.type !== 'OPEN_DOCS' || !Array.isArray(data.urls)) return;
      if (docsOpened) return;

      var urls = data.urls.filter(Boolean);
      var status = document.getElementById('status');
      if (!urls.length) {
        status.textContent = 'No hay documentos para abrir. Puede cerrar esta pestaña.';
        return;
      }

      status.textContent = 'Abriendo ' + urls.length + ' documento(s)…';
      docsOpened = true;
      urls.forEach(function (url, index) {
        setTimeout(function () { openUrl(url); }, index * 350);
      });

      setTimeout(function () {
        status.textContent = 'Documentos enviados. Puede cerrar esta pestaña.';
      }, urls.length * 350 + 400);
    });
  </script>
</body>
</html>
