<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abriendo documentos…</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #334155;
    }
    .box { text-align: center; padding: 2rem; max-width: 24rem; }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; color: #0f172a; }
    p { font-size: 0.875rem; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Abriendo documentos de tu póliza</h1>
    <p id="status">Esperando confirmación de emisión…</p>
  </div>
  <script>
    var STORAGE_KEY = 'pagos_emission_docs_pending';
    var docsOpened = false;
    var pollCount = 0;
    var maxPolls = 120;

    function openUrl(url) {
      var w = window.open(url, '_blank', 'noopener,noreferrer');
      if (w) return;
      var form = document.createElement('form');
      form.method = 'GET';
      form.action = url;
      form.target = '_blank';
      form.style.display = 'none';
      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    function tryOpenFromStorage() {
      if (docsOpened) return;
      pollCount += 1;
      var raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        return;
      }
      if (!raw) {
        if (pollCount >= maxPolls) {
          document.getElementById('status').textContent =
            'Tiempo agotado. Cierra esta pestaña y usa los enlaces en la pantalla de éxito.';
        }
        return;
      }

      var urls;
      try {
        urls = JSON.parse(raw);
      } catch (e) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }
      if (!Array.isArray(urls) || !urls.length) return;

      localStorage.removeItem(STORAGE_KEY);
      docsOpened = true;
      var status = document.getElementById('status');
      status.textContent = 'Abriendo ' + urls.length + ' documento(s)…';

      urls.forEach(function (url, index) {
        setTimeout(function () { openUrl(url); }, index * 400);
      });

      setTimeout(function () {
        status.textContent = 'Documentos abiertos. Puede cerrar esta pestaña.';
      }, urls.length * 400 + 500);
    }

    setInterval(tryOpenFromStorage, 500);
    window.addEventListener('storage', function (e) {
      if (e.key === STORAGE_KEY) tryOpenFromStorage();
    });
    tryOpenFromStorage();
  </script>
</body>
</html>
