name: 🚀 Deploy Pagos-Poliza

on:
  push:
    branches:
      - develop
      - qa

jobs:
  # ──────────────────────────────────────────
  # Deploy a servidor de DESARROLLO
  # Se dispara con push a la rama "develop"
  # ──────────────────────────────────────────
  deploy-dev:
    name: Deploy → DEV
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, pagos-dev]

    steps:
      - name: 📥 Pull cambios
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          git fetch origin develop
          git checkout -f develop
          git reset --hard origin/develop

      - name: 📦 Instalar dependencias
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          npm run install:all

      - name: 🔨 Build frontend
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          npm run build --prefix frontend

      - name: 📋 Copiar dist a Nginx
        run: |
          cp -r /opt/services/Pagos-Poliza-modulo/frontend/dist/* /var/www/html/pagos/

      - name: ♻️ Recargar PM2 (API y Web)
        run: |
          pm2 reload pagos-api
          pm2 restart pagos-web || true

      - name: ✅ Deploy DEV completado
        run: echo "Deploy a DEV finalizado correctamente — $(date)"

  # ──────────────────────────────────────────
  # Deploy a servidor de QA
  # Se dispara con push a la rama "qa"
  # ──────────────────────────────────────────
  deploy-qa:
    name: Deploy → QA
    if: github.ref == 'refs/heads/qa'
    runs-on: [self-hosted, pagos-qa]

    steps:
      - name: 📥 Pull cambios
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          git fetch origin qa
          git checkout -f qa
          git reset --hard origin/qa

      - name: 📦 Instalar dependencias
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          npm run install:all

      - name: 🔨 Build frontend
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          npm run build --prefix frontend

      - name: 📋 Copiar dist a Nginx/Apache
        run: |
          echo "=== Localizando bundle antiguo en servidor ==="
          find /var/www /opt /home -name "*B_hltFap*" 2>/dev/null || true
          echo "=== Configuraciones de Apache/Nginx para pagos ==="
          grep -rn "pagos" /etc/apache2/ 2>/dev/null || true
          grep -rn "pagos" /etc/nginx/ 2>/dev/null || true
          
          echo "=== Copiando a /var/www/html/pagos/ ==="
          mkdir -p /var/www/html/pagos/
          cp -r /opt/services/Pagos-Poliza-modulo/frontend/dist/* /var/www/html/pagos/
          
          # Si el bundle antiguo reside en otra ruta servida por Apache, sincronizar allí también
          FOUND_ASSETS=$(find /var/www -name "*B_hltFap*" 2>/dev/null | head -n 1)
          if [ -n "$FOUND_ASSETS" ]; then
            TARGET_DIR=$(dirname $(dirname "$FOUND_ASSETS"))
            echo "=== Sincronizando en directorio activo detectado: $TARGET_DIR ==="
            cp -r /opt/services/Pagos-Poliza-modulo/frontend/dist/* "$TARGET_DIR/" || true
          fi

      - name: ♻️ Recargar PM2 (API y Web)
        run: |
          pm2 reload pagos-api
          pm2 restart pagos-web || true

      - name: ✅ Deploy QA completado
        run: echo "Deploy a QA finalizado correctamente — $(date)"
