name: 🚀 Deploy Pagos-Poliza

on:
  push:
    branches:
      - develop
      - qa

jobs:
  # ──────────────────────────────────────────
  # Deploy a servidor de DESARROLLO
  # Se dispara con push a la rama "develop"
  # ──────────────────────────────────────────
  deploy-dev:
    name: Deploy → DEV
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, pagos-dev]

    steps:
      - name: 📥 Pull cambios
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          git fetch origin develop
          git checkout -f develop
          git reset --hard origin/develop

      - name: 📦 Instalar dependencias
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          npm run install:all

      - name: 🔨 Build frontend
        run: |
          cd /opt/services/Pagos-Poliza-modulo
          export VITE_APP_BASE=/pagos/
          export VITE_DEPLOY_PREFIX=/pagos
          export VITE_SKIP_PAYMENT_VERIFY=true
          npm run build --prefix frontend

      - name: 📋 Copiar dist a Nginx
        run: |
          cp -r /opt/services/Pagos-Poliza-modulo/frontend/dist/* /var/www/html/pagos/

      - name: ♻️ Recargar PM2 (API y Web)
        run: |
          pm2 reload pagos-api
          pm2 restart pagos-web || true

      - name: ✅ Deploy DEV completado
        run: echo "Deploy a DEV finalizado correctamente — $(date)"

  # ──────────────────────────────────────────
  # Deploy a servidor de QA
  # Se dispara con push a la rama "qa"
  # ──────────────────────────────────────────
  deploy-qa:
    name: Deploy → QA
    if: github.ref == 'refs/heads/qa'
    runs-on: [self-hosted, pagos-qa]

    steps:
      - name: 📥 Pull cambios
        run: |
          for DIR in "/opt/services/Pagos-Poliza-modulo" "/home/proyect/exelixi/Pagos-Poliza-modulo"; do
            if [ -d "$DIR" ]; then
              echo "=== Sincronizando repositorio en $DIR ==="
              cd "$DIR"
              git fetch origin qa
              git checkout -f qa
              git reset --hard origin/qa
            fi
          done

      - name: 📦 Instalar dependencias
        run: |
          for DIR in "/opt/services/Pagos-Poliza-modulo" "/home/proyect/exelixi/Pagos-Poliza-modulo"; do
            if [ -d "$DIR" ]; then
              echo "=== Instalando dependencias en $DIR ==="
              cd "$DIR"
              npm run install:all
            fi
          done

      - name: 🔨 Build frontend
        run: |
          export VITE_APP_BASE=/pagos/
          export VITE_DEPLOY_PREFIX=/pagos
          export VITE_SKIP_PAYMENT_VERIFY=true
          if [ -d "/opt/services/Pagos-Poliza-modulo" ]; then
            cd /opt/services/Pagos-Poliza-modulo
            npm run build --prefix frontend
          elif [ -d "/home/proyect/exelixi/Pagos-Poliza-modulo" ]; then
            cd /home/proyect/exelixi/Pagos-Poliza-modulo
            npm run build --prefix frontend
          fi

      - name: 📋 Copiar dist a Nginx/Apache y PM2 webroot
        run: |
          DIST_SRC=""
          if [ -d "/opt/services/Pagos-Poliza-modulo/frontend/dist" ]; then
            DIST_SRC="/opt/services/Pagos-Poliza-modulo/frontend/dist"
          elif [ -d "/home/proyect/exelixi/Pagos-Poliza-modulo/frontend/dist" ]; then
            DIST_SRC="/home/proyect/exelixi/Pagos-Poliza-modulo/frontend/dist"
          fi

          echo "=== Copiando dist desde $DIST_SRC ==="
          mkdir -p /var/www/html/pagos/
          cp -r "$DIST_SRC"/* /var/www/html/pagos/

          if [ -d "/home/proyect/exelixi/Pagos-Poliza-modulo/frontend/dist" ]; then
            echo "=== Sincronizando en PM2 webroot /home/proyect/exelixi/Pagos-Poliza-modulo/frontend/dist/ ==="
            mkdir -p /home/proyect/exelixi/Pagos-Poliza-modulo/frontend/dist/
            cp -r "$DIST_SRC"/* /home/proyect/exelixi/Pagos-Poliza-modulo/frontend/dist/
          fi

      - name: ♻️ Recargar PM2 (API y Web)
        run: |
          pm2 reload pagos-api || true
          pm2 restart pagos-web || true
          pm2 status

      - name: ✅ Deploy QA completado
        run: echo "Deploy a QA finalizado correctamente — $(date)"
